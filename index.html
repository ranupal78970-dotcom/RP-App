<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RP App Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .section-title h2 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        .section-title p {
            color: #6b7280;
        }

        .apps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
        }

        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 16px;
        }

        .app-card h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .version {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .app-card p {
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .download-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            padding: 35px 20px;
            margin-top: 35px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>📱 RP App Store</h1>
        <p>Ranu Pal द्वारा बनाए गए Android Apps</p>
    </header>

    <main class="container">

        <div class="section-title">
            <h2>Our Apps</h2>
            <p>अपने पसंदीदा ऐप डाउनलोड करें</p>
        </div>

        <div class="apps">

            <!-- AnyPrint -->
            <div class="app-card">

                <div class="app-icon">
                    🖨️
                </div>

                <h3>AnyPrint</h3>

                <span class="version">
                    Version 1.0.0
                </span>

                <p>
                    PDF और Image printing के लिए आसान और उपयोगी Android app.
                </p>

                <a
                    class="download-btn"
                    href="https://github.com/ranupal78970-dotcom/RP-App/releases/download/v1.0.0/Any.Print.apk">
                    📥 Download AnyPrint
                </a>

            </div>

        </div>

    </main>

    <footer class="footer">
        © 2026 RP App Store · Developed by Ranu Pal
    </footer>

</body>
</html>
